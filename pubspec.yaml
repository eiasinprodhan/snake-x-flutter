name: snakex
description: A premium, AAA-style Snake Game built with Flutter.
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local Storage
  shared_preferences: ^2.2.2

  # Monetization
  google_mobile_ads: ^5.1.0

  # UI & UX
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  glassmorphism: ^3.0.0
  share_plus: ^10.1.3
  
  # Hardware/Sensors
  vibration: ^2.0.0
  audioplayers: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_icon_new.png"
  min_sdk_android: 21 # android min sdk version

flutter:
  uses-material-design: true

  assets:
    - assets/audio/eat.mp3
    - assets/audio/click.mp3
    - assets/audio/game_over.mp3
    - assets/images/logo.png
